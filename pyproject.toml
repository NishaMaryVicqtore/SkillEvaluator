[project]
name = "skill-evaluator"
version = "0.1.0"
description = "Score PRD, BRD, and architecture skills, and validate Trimble agent skills with TSE."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "pydantic>=2.0",
  "rich",
  "scikit-learn",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skill-evaluator = "skill_evaluator.cli:main"
tse = "tse.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skill_evaluator*", "tse*"]
